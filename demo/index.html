<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piedmont Books</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
  <header>
    <p class="shop">Piedmont Books</p>
    <a id="hours" href="#open">Hours</a>
  </header>
  <main>
    <h1>Hold a book</h1>
    <p>Tell us the title and we'll check the shelves this afternoon.</p>
    <form action="#hold">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" tabindex="1" autocomplete="email">
      <button id="reserve" type="submit">Reserve</button>
    </form>
    <p id="open" class="note">Open 10 to 6. Closed Tuesday.</p>
  </main>
  <a id="staff" href="/staff">Staff desk</a>
  <div id="pickup" role="dialog" aria-modal="true" aria-labelledby="pickup-title">
    <h2 id="pickup-title">In the shop today</h2>
    <p>We can hold a copy of The Left Hand of Darkness until 6.</p>
    <button id="keep" type="button">Hold it for me</button>
    <button id="close" type="button">No thanks</button>
  </div>
  <script src="site.js"></script>
</body>
</html>
