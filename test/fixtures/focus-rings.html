<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>focus rings</title>
<style>
  body { font: 16px sans-serif; padding: 20px; }
  p { margin: 16px 0; }
  #plain-ring:focus { outline: 3px solid #1a5fd0; outline-offset: 2px; }
  #no-ring:focus { outline: none; }
  #shadow-ring:focus { outline: none; box-shadow: 0 0 0 3px #e0a400; }
  #visible-only:focus { outline: none; }
  #visible-only:focus-visible { outline: 2px dashed #222; }
  #tint { background: #eee; border: 1px solid #999; }
  #tint:focus { outline: none; background: #2b6a3e; color: #fff; }
  #ghost:focus { outline: none; box-shadow: 0 0 0 3px transparent; }
  #name { border: 1px solid #888; }
  #name:focus { outline: none; }
</style>
<body>
  <p><a href="#a" id="plain-ring">Plain ring</a></p>
  <p><button id="no-ring" type="button">No ring</button></p>
  <p><a href="#b" id="shadow-ring">Shadow ring</a></p>
  <p><button id="visible-only" type="button">Visible only</button></p>
  <p><button id="tint" type="button">Tint</button></p>
  <p><button id="ghost" type="button">Ghost</button></p>
  <p><input id="name" name="name" aria-label="Name"></p>
</body>
</html>
